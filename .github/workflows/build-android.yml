name: Build Kurt Dhylan Moto Shop Inventory APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Build APK
        run: >
          dotnet publish KurtDhylanMotoShopInventory.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Find APK
        run: |
          mkdir -p artifacts
          find bin/Release/net10.0-android -type f -name "*.apk" -exec cp {} artifacts/KurtDhylanMotoShopInventory.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KurtDhylanMotoShopInventory-APK
          path: artifacts/KurtDhylanMotoShopInventory.apk
