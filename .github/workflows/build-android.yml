name: Build Kurt Dhylan Moto Shop Inventory V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*Source.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP was not found in the repository root."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Find MAUI project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -type f -name '*.csproj' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .csproj file was found after extracting the source ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          PROJECT_NAME=$(basename "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

          echo "Project: $PROJECT"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore project
        working-directory: ${{ env.PROJECT_DIR }}
        run: dotnet restore "${{ env.PROJECT_NAME }}"

      - name: Publish Android APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: >-
          dotnet publish "${{ env.PROJECT_NAME }}"
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          APK=$(find extracted -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" artifacts/KurtDhylanMotoShopInventoryV3.apk

          echo "APK created:"
          echo "artifacts/KurtDhylanMotoShopInventoryV3.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KurtDhylanMotoShopInventoryV3-APK
          path: artifacts/KurtDhylanMotoShopInventoryV3.apk
          if-no-files-found: error
